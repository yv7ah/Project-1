<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Start Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage" id="stage">
    <canvas id="virus-canvas"></canvas>

    <button class="sprite start" id="start-btn" aria-label="Start game"></button>
    <button class="sprite btn records" id="records-btn" aria-label="Records"></button>
    <button class="sprite btn save" id="save-btn" aria-label="Save"></button>

    <p class="press" id="press-text">PRESS ANY KEY TO START</p>
  </main>

  <!-- 팝업 (records / save 공용 구조) -->
  <div class="modal" id="records-modal" hidden>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="records-title">
      <h2 id="records-title">RECORDS</h2>
      <div class="modal-body" id="records-body">준비 중입니다.</div>
      <button class="modal-close" data-close>CLOSE</button>
    </div>
  </div>

  <div class="modal" id="save-modal" hidden>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="save-title">
      <h2 id="save-title">SAVE</h2>
      <div class="modal-body" id="save-body">준비 중입니다.</div>
      <button class="modal-close" data-close>CLOSE</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
